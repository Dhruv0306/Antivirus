name: Threat-Intel Feed Integrity Check
on:
    schedule:
        # 04:00 UTC daily, an hour after the pressure-test workflow's 03:00
        # slot so the two never contend for the same runner queue.
        - cron: "0 4 * * *"
    workflow_dispatch:

# Read-only: this workflow never commits anything back to the repo, unlike
# pressure-test.yml, so it doesn't need contents: write.
permissions:
    contents: read

jobs:
    threat-intel-feed-check:
        runs-on: ubuntu-latest
        # This is a single, fast HTTP call and parse, not a load test; a
        # short cap keeps a hung/slow third-party response from tying up a
        # runner all night instead of just failing the job.
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - name: Set up JDK 21
              uses: actions/setup-java@v6
              with:
                  distribution: "temurin"
                  java-version: "21"
                  cache: "maven"

            # abuse.ch retired the keyless MalwareBazaar export URLs (they
            # now answer HTTP 410 Gone). Exports require a free Auth-Key,
            # supplied here from the ABUSECH_AUTH_KEY repository secret.
            # Fail fast with a clear message when it is missing, instead of
            # letting the test fail later with an unrelated "0 hashes".
            - name: Require abuse.ch Auth-Key
              env:
                    ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
              run: |
                  if [ -z "$ABUSECH_AUTH_KEY" ]; then
                      echo "::error::Repository secret ABUSECH_AUTH_KEY is not set. Create a free Auth-Key at https://auth.abuse.ch/ and add it under Settings > Secrets and variables > Actions."
                      exit 1
                  fi

            # Deliberately its own profile (live-feed-check), never
            # -Ppressure: this test hits real internet infrastructure
            # (abuse.ch MalwareBazaar) and must never be able to block a PR
            # merge if that third party is briefly slow or down. See the
            # class-level Javadoc on ThreatIntelLiveFeedIT for the full
            # rationale, and docs/plans/real-world-testing-phase-plan.md,
            # Phase 3.
            #
            # dependency-check is bound to the verify lifecycle globally, so
            # it is skipped here: it spent about 70 s of a 100 s run on an NVD
            # update that has nothing to do with this check, and
            # dependency_check.yml already covers it.
            - name: Check live MalwareBazaar feed integration
              env:
                    ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
              run: mvn -B verify -Plive-feed-check -Ddependency-check.skip=true --file pom.xml

            - name: Upload failsafe reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: threat-intel-feed-check-reports
                  path: target/failsafe-reports/
                  retention-days: 14

            - name: Notify on failure
              if: failure()
              run: |
                  echo "::error::The live MalwareBazaar recent-feed check failed. Check the job log for the HTTP status first: 401/403 means the ABUSECH_AUTH_KEY secret is invalid or revoked, 410 means abuse.ch retired the endpoint being called, and a 200 with a low hash count means the export format changed and ThreatIntelSignatureService.extractSha256Signatures() needs updating. Either way it is worth a look before assuming known-hash detection still works in production. See the failsafe-reports artifact for the parsed hash count."
