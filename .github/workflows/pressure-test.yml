name: Pressure Tests
on:
    schedule:
        # 03:00 UTC daily. Off peak hours, keeps a consistent 24h cadence
        # without piling onto whatever time the workflow was first merged.
        - cron: "0 3 * * *"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    pressure-test:
        runs-on: ubuntu-latest
        # Concurrent load generation, the app's own startup/DB work under
        # that load, and now a 1000+ file accuracy corpus scanned through
        # the real endpoint can run well past the default 6h GitHub Actions
        # ceiling on a slow runner; this is a generous but bounded cap.
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "21"
                  cache: "maven"

            # Cache the Dependency-Check data directory to speed up the NVD update process
            - name: Cache OWASP Dependency Check Data
              uses: actions/cache@v4
              with:
                  path: ~/.m2/repository/org/owasp/dependency-check-data
                  key: ${{ runner.os }}-odc-${{ github.run_number }}
                  restore-keys: |
                      ${{ runner.os }}-odc-

            - name: Run pressure/load/accuracy suite
              env:
                  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
              run: mvn -B verify -Ppressure -DnvdApiKey="$NVD_API_KEY"

            - name: Upload failsafe reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: pressure-test-reports
                  path: target/failsafe-reports/
                  retention-days: 14

            # Runs even if the suite above failed: EndpointPressureIT and
            # ScanAccuracyIT flush their JSON in @AfterAll, which JUnit
            # still runs after an assertion failure, so there is usually
            # something worth rendering either way.
            - name: Generate pressure/accuracy report
              if: always()
              continue-on-error: true
              run: python3 scripts/generate_pressure_report.py

            - name: Commit updated metrics report
              if: always()
              run: |
                  if [ ! -f docs/pressure-metrics.md ] && [ ! -f docs/pressure-metrics.svg ]; then
                      echo "No report files were generated; nothing to commit."
                      exit 0
                  fi
                  if git diff --quiet -- docs/pressure-metrics.md docs/pressure-metrics.svg; then
                      echo "No metrics changes to commit."
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add docs/pressure-metrics.md docs/pressure-metrics.svg
                  git commit -m "docs: update pressure/accuracy metrics [skip ci]"
                  git push origin HEAD:${{ github.ref_name }}

            - name: Notify on failure
              if: failure()
              run: |
                  echo "::error::Pressure suite failed on schedule. See the failsafe-reports artifact and the job log above for which threshold broke (error rate, latency, the auth rate limiter not engaging, or detection accuracy)."
