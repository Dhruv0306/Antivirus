name: Integration Tests
on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

jobs:
    integration-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up JDK 21
              uses: actions/setup-java@v6
              with:
                  distribution: "temurin"
                  java-version: "21"
                  cache: "maven"

            # Cache the Dependency-Check data directory to speed up the NVD update process
            - name: Cache OWASP Dependency Check Data
              uses: actions/cache@v6
              with:
                  path: ~/.m2/repository/org/owasp/dependency-check-data
                  key: ${{ runner.os }}-odc-${{ github.run_number }}
                  restore-keys: |
                      ${{ runner.os }}-odc-

            - name: Run full end-to-end integration suite
              env:
                  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
              run: |
                  if [ -n "${{ secrets.NVD_API_KEY }}" ]; then
                    export NVD_API_KEY="${{ secrets.NVD_API_KEY }}"
                    echo "NVD_API_KEY is set"
                    mvn -B verify -Pintegration -DnvdApiKey="$NVD_API_KEY"
                  else
                    unset NVD_API_KEY
                    echo "NVD_API_KEY is not set"
                    mvn -B verify -Pintegration -DautoUpdate=false
                  fi

            - name: Upload failsafe reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: integration-test-reports
                  path: target/failsafe-reports/
                  retention-days: 14

            - name: Notify on failure
              if: failure()
              run: |
                  echo "::error::Integration suite failed. See the failsafe-reports artifact and the job log above for which threshold broke (error rate, latency, or the auth rate limiter not engaging)."
