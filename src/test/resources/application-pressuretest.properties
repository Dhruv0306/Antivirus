# Profile used only by the *PressureIT.java suite (mvn verify -Ppressure).
# Isolated, in-memory H2 per test JVM, Flyway disabled in favor of
# Hibernate ddl-auto so the suite doesn't depend on migration state.
spring.datasource.url=jdbc:h2:mem:antivirus_pressuretest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.admin.username=pressure_admin
app.admin.password=PressureTestAdminPass123!

app.cors.allowed-origins=http://127.0.0.1:5173
app.quarantine.dir=${java.io.tmpdir}/antivirus-pressuretest-quarantine

# Wider connection pool: the pressure suite deliberately opens many
# concurrent connections and shouldn't be bottlenecked by a default
# HikariCP pool size of 10 before it even reaches the code under test.
spring.datasource.hikari.maximum-pool-size=40
