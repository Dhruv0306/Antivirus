# Profile used only by the *IntegrationIT.java suite (mvn verify -Pintegration).
# Isolated, in-memory H2 per test JVM, Flyway disabled in favor of
# Hibernate ddl-auto so the suite doesn't depend on migration state.
spring.datasource.url=jdbc:h2:mem:antivirus_integrationtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.admin.username=integration_admin
app.admin.password=IntegrationTestAdminPass123!

# SecurityConfig rejects any origin containing "localhost" outside the dev profile,
# so keep integration tests on loopback IPs instead of localhost hostnames.
app.cors.allowed-origins=http://127.0.0.1:5173
app.quarantine.dir=${java.io.tmpdir}/antivirus-integrationtest-quarantine
